apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
spec:
  acme:
    # Staging server for testing
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform-team@contoso.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # HTTP01 challenge solver using ingress
      - http01:
          ingress:
            class: nginx
            podTemplate:
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 1000
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
spec:
  acme:
    # Production server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-team@contoso.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP01 challenge solver using ingress
      - http01:
          ingress:
            class: nginx
            podTemplate:
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 1000
---
# DNS01 solver for wildcard certificates (requires Azure DNS)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-team@contoso.com
    privateKeySecretRef:
      name: letsencrypt-dns-account-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: ${AZURE_SUBSCRIPTION_ID}
            resourceGroupName: ${AZURE_DNS_RESOURCE_GROUP}
            hostedZoneName: ${AZURE_DNS_ZONE}
            # Use Workload Identity
            managedIdentity:
              clientID: ${CERT_MANAGER_CLIENT_ID}
