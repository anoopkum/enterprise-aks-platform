# Resource quotas for application namespaces
# Dev environment - smaller quotas
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: app-team-a-dev
  labels:
    app.kubernetes.io/name: resource-quota
    environment: dev
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"
    persistentvolumeclaims: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: resource-quota
  namespace: app-team-b-dev
  labels:
    app.kubernetes.io/name: resource-quota
