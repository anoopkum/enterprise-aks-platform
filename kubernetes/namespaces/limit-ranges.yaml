# LimitRanges for application namespaces
# Sets default resource requests/limits for containers
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limit-range
  namespace: app-team-a-dev
  labels:
    app.kubernetes.io/name: limit-range
    environment: dev
spec:
  limits:
    # Default limits for containers
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 2
        memory: 4Gi
    # Limits for pods
    - type: Pod
      max:
        cpu: 4
        memory: 8Gi
    # Limits for PVCs
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 50Gi
