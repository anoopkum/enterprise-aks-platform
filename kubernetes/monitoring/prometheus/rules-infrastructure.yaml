apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infrastructure-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: infrastructure-alerts
    app.kubernetes.io/component: alerting
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: kubernetes.pod.alerts
      rules:
        # Pod crash looping
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 5m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Pod is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last hour"
            runbook_url: "https://wiki.internal/runbooks/pod-crash-loop"

        # Pod not ready
        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (
              max by(namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))
            ) > 0
          for: 15m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Pod has been in non-ready state for too long"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 15 minutes"

        # Container OOM killed
        - alert: ContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Container was OOM killed"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed"

    - name: kubernetes.node.alerts
      rules:
        # Node not ready
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            category: infrastructure
          annotations:
            summary: "Kubernetes node is not ready"
            description: "Node {{ $labels.node }} has been unready for more than 5 minutes"
            runbook_url: "https://wiki.internal/runbooks/node-not-ready"

        # Node memory pressure
        - alert: NodeMemoryPressure
          expr: |
            kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Node has memory pressure"
            description: "Node {{ $labels.node }} is under memory pressure"

        # Node disk pressure
        - alert: NodeDiskPressure
          expr: |
            kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Node has disk pressure"
            description: "Node {{ $labels.node }} is under disk pressure"

        # Node high CPU usage
        - alert: NodeHighCPUUsage
          expr: |
            (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
          for: 10m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage is above 85% (current: {{ $value }}%)"

        # Node high memory usage
        - alert: NodeHighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 10m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage is above 85% (current: {{ $value }}%)"

    - name: kubernetes.deployment.alerts
      rules:
        # Deployment replicas mismatch
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 10m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "Deployment has replica mismatch"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} available replicas, expected {{ $labels.spec_replicas }}"

        # HPA at max replicas
        - alert: HPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
          for: 15m
          labels:
            severity: warning
            category: infrastructure
          annotations:
            summary: "HPA is at maximum replicas"
            description: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been at max replicas for 15 minutes"
