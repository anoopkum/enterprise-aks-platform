apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: database-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: database-alerts
    app.kubernetes.io/component: alerting
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: postgresql.alerts
      rules:
        # Connection pool exhaustion
        - alert: PostgreSQLConnectionPoolExhausted
          expr: |
            (pg_stat_activity_count / pg_settings_max_connections) > 0.8
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "PostgreSQL connection pool is nearly exhausted"
            description: "PostgreSQL instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of available connections"
            runbook_url: "https://wiki.internal/runbooks/postgresql-connections"

        # Connection pool critical
        - alert: PostgreSQLConnectionPoolCritical
          expr: |
            (pg_stat_activity_count / pg_settings_max_connections) > 0.95
          for: 2m
          labels:
            severity: critical
            category: database
          annotations:
            summary: "PostgreSQL connection pool is critically exhausted"
            description: "PostgreSQL instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of available connections"

        # Slow queries
        - alert: PostgreSQLSlowQueries
          expr: |
            rate(pg_stat_activity_max_tx_duration{state="active"}[5m]) > 60
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "PostgreSQL has long-running queries"
            description: "PostgreSQL instance {{ $labels.instance }} has queries running longer than 60 seconds"

        # Replication lag
        - alert: PostgreSQLReplicationLag
          expr: |
            pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "PostgreSQL replication lag is high"
            description: "PostgreSQL replication lag is {{ $value }} seconds on {{ $labels.instance }}"

        # Dead tuples (needs vacuum)
        - alert: PostgreSQLHighDeadTuples
          expr: |
            (pg_stat_user_tables_n_dead_tup / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup)) > 0.1
          for: 30m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "PostgreSQL table has high dead tuple ratio"
            description: "Table {{ $labels.relname }} in database {{ $labels.datname }} has {{ $value | humanizePercentage }} dead tuples"

    - name: pgbouncer.alerts
      rules:
        # PgBouncer pool saturation
        - alert: PgBouncerPoolSaturation
          expr: |
            (pgbouncer_pools_server_active_connections / pgbouncer_pools_server_maxconn) > 0.8
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "PgBouncer connection pool is saturated"
            description: "PgBouncer pool {{ $labels.database }} is {{ $value | humanizePercentage }} saturated"

        # PgBouncer waiting clients
        - alert: PgBouncerWaitingClients
          expr: |
            pgbouncer_pools_client_waiting_connections > 10
          for: 5m
          labels:
            severity: warning
            category: database
          annotations:
            summary: "PgBouncer has waiting clients"
            description: "PgBouncer pool {{ $labels.database }} has {{ $value }} waiting clients"
