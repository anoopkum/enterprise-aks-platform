apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireNonRoot
metadata:
  name: require-non-root
  annotations:
    description: Requires all containers to run as non-root user
spec:
  # Start in audit mode, switch to deny after validation
  enforcementAction: warn
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "DaemonSet", "StatefulSet", "ReplicaSet"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - azure-arc
      - calico-system
  parameters:
    exemptImages:
      # Microsoft system containers
      - "mcr.microsoft.com/*"
      # Azure Arc containers
      - "*.azurecr.io/azure-arc/*"
