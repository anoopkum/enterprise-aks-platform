apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sBlockPrivileged
metadata:
  name: block-privileged-containers
  annotations:
    description: Blocks containers from running in privileged mode
spec:
  # Start in audit mode, switch to deny after validation
  enforcementAction: warn
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "DaemonSet", "StatefulSet", "ReplicaSet"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - azure-arc
      - calico-system
      - tigera-operator
  parameters:
    exemptImages:
      # Microsoft system containers that may need privileges
      - "mcr.microsoft.com/oss/kubernetes/kube-proxy:*"
      - "mcr.microsoft.com/oss/calico/*"
      - "mcr.microsoft.com/azuremonitor/*"
    allowPrivilegeEscalation: false
